# EXAMPLE ONLY: shows the shape of the two secrets. The README creates them with
# `kubectl create secret` instead, so real values never land in a file in this repo.
# Not listed in kustomization.yaml on purpose.
---
# Amazon SES SMTP credentials (SES console -> SMTP settings -> Create SMTP credentials).
# RELAY_PASSWORD is the SMTP password shown on that screen, NOT the IAM secret access key.
apiVersion: v1
kind: Secret
metadata:
  name: smtp-relay-upstream
  namespace: smtp-relay
type: Opaque
stringData:
  RELAY_USER: "AKIAXXXXXXXXXXXXXXXX"
  RELAY_PASSWORD: "ses-smtp-password"
---
# Logins that in-cluster apps use to authenticate to THIS relay. One per line:
#   user@realm:password   -> app logs in as "user@realm"
#   user:password         -> app logs in as "user" (realm = SASL_REALM, i.e. user@faultycloud.xyz)
# The username can't contain ":"; the password can (everything after the first ":").
apiVersion: v1
kind: Secret
metadata:
  name: smtp-relay-users
  namespace: smtp-relay
type: Opaque
stringData:
  users: |
    grafana@faultycloud.xyz:change-me-long-random
    n8n@faultycloud.xyz:change-me-too
